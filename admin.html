<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anandeshwar Graphics — Full CMS</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f7f4f0;color:#18151b;font-family:Inter,sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:18px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font:800 1.2rem Poppins}.brand span{color:#ed2f82}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(110deg,#ff9a00,#ed2f82);color:#fff}.ghost{background:#fff;border:1px solid #ddd}.danger{background:#fff;color:#b22;border:1px solid #ecc}.panel{background:#fff;border:1px solid #e4dfda;border-radius:20px;padding:18px;box-shadow:0 10px 30px #2b1b1308;margin-bottom:14px}.field{width:100%;padding:11px 12px;border:1px solid #ddd7d3;border-radius:11px;margin:6px 0 12px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 12px;position:sticky;top:0;background:#f7f4f0;z-index:5}.tab{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:9px 13px;font-weight:700;font-size:.78rem}.tab.active{background:#18151b;color:#fff}.section{display:none}.section.active{display:block}.item{border:1px solid #e2ddd8;border-radius:15px;padding:14px;margin:10px 0;background:#fcfbfa}.itemhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:.78rem;color:#777;line-height:1.55}.status{font-weight:700;min-height:22px}.ok{color:#15824a}.err{color:#b22}.login{max-width:430px;margin:70px auto}.hidden{display:none!important}textarea.field{resize:vertical}.savebar{position:sticky;bottom:10px;background:#18151bf2;color:#fff;border-radius:16px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:10}.savebar .btn{flex:0 0 auto}@media(max-width:650px){.row{grid-template-columns:1fr}.savebar{font-size:.75rem}.savebar .btn{padding:10px 12px}}h1,h2,h3{font-family:Poppins,sans-serif}.mini{font-size:.72rem;color:#777} </style></head><body><div class="wrap"><div class="top"><div class="brand">Anandeshwar <span>Graphics</span> · CMS</div><a class="btn ghost" href="index.html">View Site</a></div><section id="loginBox" class="panel login"><h2>Secure Admin Login</h2><p class="note">Use the Firebase admin email and password you created.</p><input id="emailLogin" class="field" type="email" placeholder="Admin email"><input id="passLogin" class="field" type="password" placeholder="Password"><button class="btn primary" id="loginBtn">Login</button><div id="loginMsg" class="status err"></div></section><main id="app" class="hidden"><div class="panel"><div class="itemhead"><div>Signed in as <strong id="who"></strong></div><button class="btn ghost" id="logout">Logout</button></div><p class="note">Edit any section below. Then press <b>Save Everything to Cloud</b>. The public site reads the same Firestore document.</p></div><div class="tabs" id="tabs"></div><div id="sections"></div><div class="savebar"><span id="saveMsg">Changes are local until saved.</span><button class="btn primary" id="saveBtn">Save Everything to Cloud</button></div></main></div>
<script>
const ADMIN_UID='KAifIZfGSJdgiv8jdjk7PjvTOls1';
const DEFAULTS={"nav":{"home":"Home","services":"Services","work":"Work","about":"About","pricing":"Pricing","contact":"Contact"},"hero":{"eyebrow":"ANANDESHWAR GRAPHICS","title":"Designs that make your brand <span class=\"gradient-text\">impossible to ignore.</span>","description":"Premium graphic design for brands, creators and businesses — crafted to look memorable, modern and unmistakably yours.","primaryText":"Start a Project","primaryLink":"#contact","secondaryText":"Explore Work","secondaryLink":"#portfolio"},"stats":[{"number":"50+","label":"Projects delivered"},{"number":"25+","label":"Happy clients"},{"number":"3+","label":"Years of creativity"}],"servicesTitle":"Creative services built for <span class=\"gradient-text\">growth.</span>","servicesIntro":"From social media creatives to complete brand visuals, every piece is designed to look intentional and premium.","services":[{"name":"Social Media Design","desc":"Scroll-stopping posts, carousels and story creatives for Instagram and social pages.","icon":"✦"},{"name":"Brand Identity","desc":"Logos, color systems and visual direction that give your brand a consistent look.","icon":"◈"},{"name":"Print & Marketing","desc":"Posters, flyers, banners and promotional graphics ready for digital or print.","icon":"▣"}],"portfolioTitle":"Selected <span class=\"gradient-text\">work.</span>","portfolioIntro":"A mix of branding, social media and promotional design made for modern creators and businesses.","portfolio":[{"title":"{title} placeholder","category":"Branding","image":"{img}","description":"Premium visual design project."},{"title":"Creative studio placeholder","category":"Social","image":"https://images.unsplash.com/photo-1558655146-9f40138edfeb?auto=format&fit=crop&w=1200&q=80","description":"Premium visual design project."}],"processTitle":"Simple process. <span class=\"gradient-text\">Strong results.</span>","process":[{"title":"Discover","desc":"We understand your goal, audience and visual direction."},{"title":"Create","desc":"Concepts are developed with clear hierarchy and premium visual details."},{"title":"Refine","desc":"You share feedback and we polish the final direction."},{"title":"Deliver","desc":"Final files are prepared for the platforms and formats you need."}],"aboutTitle":"Design with purpose, <span class=\"gradient-text\">not noise.</span>","aboutText":"Anandeshwar Graphics helps creators, businesses and Instagram pages build a stronger visual presence through clean, modern and memorable design.","aboutImage":"https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1200&q=80","aboutBadge":"Creative studio · India","tools":["Photoshop","Illustrator","Canva","CorelDRAW","Premiere Pro"],"testimonialsTitle":"Made to be <span class=\"gradient-text\">remembered.</span>","testimonials":[{"name":"Arjun","role":"Business Owner","review":"The designs instantly made our page look more professional and consistent.","rating":5},{"name":"Shreya","role":"Creator","review":"Fast communication, clean concepts and a final design that felt exactly right.","rating":5},{"name":"Rahul","role":"Founder","review":"Our promotional creatives finally feel like one strong brand instead of random posts.","rating":5}],"pricingTitle":"Choose your <span class=\"gradient-text\">creative plan.</span>","pricingIntro":"Starter packages for creators and businesses. Custom quotes are available for larger requirements.","pricing":[{"name":"Starter","price":"₹999","period":"/ project","features":["3 Social Media Designs","1 Revision Round","JPG / PNG Delivery","3–5 Day Delivery"],"popular":false},{"name":"Growth","price":"₹2,499","period":"/ package","features":["10 Social Media Designs","Logo / Brand Styling","2 Revision Rounds","Priority Delivery"],"popular":true},{"name":"Pro","price":"₹4,999","period":"/ package","features":["Complete Creative Kit","15+ Social Designs","Print + Digital Assets","Priority Support"],"popular":false}],"productsTitle":"Ready-to-use <span class=\"gradient-text\">design packs.</span>","productsIntro":"Premium digital products for creators, businesses and social media pages.","products":[{"name":"Instagram Post Pack","price":"₹199","badge":"BEST SELLER","desc":"Premium social media post templates for creators and businesses."},{"name":"Festival Creative Pack","price":"₹149","badge":"HOT","desc":"Ready-to-use festive designs for your social pages."},{"name":"Reels Cover Pack","price":"₹199","badge":"NEW","desc":"Modern covers designed to make your reels grid look premium."},{"name":"Business Poster Pack","price":"₹179","badge":"","desc":"Professional promotional posters for your business."},{"name":"Logo Starter Kit","price":"₹399","badge":"","desc":"A clean starter identity kit for new brands."},{"name":"Ultimate Creator Pack","price":"₹599","badge":"VALUE","desc":"A complete digital creative bundle for your page."}],"contactTitle":"Have an idea? <span class=\"gradient-text\">Let’s build it.</span>","contactIntro":"Tell us what you need and we’ll get back to you with the next steps.","whatsapp":"919999999999","email":"hello@anandeshwargraphics.com","instagram":"https://instagram.com/","location":"India · Working with clients remotely","footerText":"Anandeshwar Graphics. All rights reserved."};
let cfg=structuredClone(DEFAULTS),auth,db;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>{{if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';if(m==='"')return '&quot;';return '&#39;'}});
const sections=[['home','Home'],['services','Services'],['portfolio','Portfolio'],['process','Process'],['about','About'],['testimonials','Testimonials'],['pricing','Pricing'],['products','Products'],['contact','Contact']];
function inp(label,path,val,area=false){return `<label>${esc(label)}</label>${area?`<textarea class="field" data-path="${path}" rows="4">${esc(val)}</textarea>`:`<input class="field" data-path="${path}" value="${esc(val)}">`}`}
function render(){
$('tabs').innerHTML=sections.map((s,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${s[0]}">${s[1]}</button>`).join('');
$('sections').innerHTML=`
<div class="section active" id="sec-home"><div class="panel"><h2>Home / Front Page</h2>${inp('Eyebrow','hero.eyebrow',cfg.hero.eyebrow)}${inp('Main heading (HTML span allowed)','hero.title',cfg.hero.title,true)}${inp('Hero description','hero.description',cfg.hero.description,true)}<div class="row">${inp('Primary button','hero.primaryText',cfg.hero.primaryText)}${inp('Primary link','hero.primaryLink',cfg.hero.primaryLink)}</div><div class="row">${inp('Secondary button','hero.secondaryText',cfg.hero.secondaryText)}${inp('Secondary link','hero.secondaryLink',cfg.hero.secondaryLink)}</div></div><div class="panel"><h3>Navigation labels</h3>${Object.entries(cfg.nav).map(([k,v])=>inp(k,'nav.'+k,v)).join('')}</div><div class="panel"><h3>Stats</h3><div id="statsItems"></div><button class="btn primary" onclick="addStat()">+ Add Stat</button></div></div>
<div class="section" id="sec-services"><div class="panel"><h2>Services</h2>${inp('Section heading (HTML allowed)','servicesTitle',cfg.servicesTitle,true)}${inp('Section intro','servicesIntro',cfg.servicesIntro,true)}<div id="servicesItems"></div><button class="btn primary" onclick="addService()">+ Add Service</button></div></div>
<div class="section" id="sec-portfolio"><div class="panel"><h2>Portfolio / Work</h2>${inp('Section heading (HTML allowed)','portfolioTitle',cfg.portfolioTitle,true)}${inp('Section intro','portfolioIntro',cfg.portfolioIntro,true)}<div id="portfolioItems"></div><button class="btn primary" onclick="addPortfolio()">+ Add Project</button></div></div>
<div class="section" id="sec-process"><div class="panel"><h2>Process</h2>${inp('Heading (HTML allowed)','processTitle',cfg.processTitle,true)}<div id="processItems"></div><button class="btn primary" onclick="addProcess()">+ Add Step</button></div></div>
<div class="section" id="sec-about"><div class="panel"><h2>About</h2>${inp('Heading (HTML allowed)','aboutTitle',cfg.aboutTitle,true)}${inp('About text','aboutText',cfg.aboutText,true)}${inp('Image URL','aboutImage',cfg.aboutImage)}${inp('Badge text','aboutBadge',cfg.aboutBadge)}<label>Tools (comma separated)</label><input class="field" data-path="tools" value="${esc(cfg.tools.join(', '))}"></div></div>
<div class="section" id="sec-testimonials"><div class="panel"><h2>Testimonials</h2>${inp('Heading (HTML allowed)','testimonialsTitle',cfg.testimonialsTitle,true)}<div id="testimonialItems"></div><button class="btn primary" onclick="addTestimonial()">+ Add Testimonial</button></div></div>
<div class="section" id="sec-pricing"><div class="panel"><h2>Pricing</h2>${inp('Heading (HTML allowed)','pricingTitle',cfg.pricingTitle,true)}${inp('Intro','pricingIntro',cfg.pricingIntro,true)}<div id="pricingItems"></div><button class="btn primary" onclick="addPricing()">+ Add Plan</button></div></div>
<div class="section" id="sec-products"><div class="panel"><h2>Creative Store Products</h2>${inp('Heading (HTML allowed)','productsTitle',cfg.productsTitle,true)}${inp('Intro','productsIntro',cfg.productsIntro,true)}<div id="productItems"></div><button class="btn primary" onclick="addProduct()">+ Add Product</button></div></div>
<div class="section" id="sec-contact"><div class="panel"><h2>Contact / Footer</h2>${inp('Heading (HTML allowed)','contactTitle',cfg.contactTitle,true)}${inp('Intro','contactIntro',cfg.contactIntro,true)}<div class="row">${inp('WhatsApp number','whatsapp',cfg.whatsapp)}${inp('Email','email',cfg.email)}</div>${inp('Instagram URL','instagram',cfg.instagram)}${inp('Location','location',cfg.location)}${inp('Footer text','footerText',cfg.footerText)}</div></div>`;
renderLists(); bindPaths(); bindTabs();}
function itemCard(title,body,remove){return `<div class="item"><div class="itemhead"><strong>${title}</strong><button class="btn danger" onclick="${remove}">Delete</button></div>${body}</div>`}
function renderLists(){
$('statsItems').innerHTML=cfg.stats.map((x,i)=>itemCard('Stat '+(i+1),inp('Number',`stats.${i}.number`,x.number)+inp('Label',`stats.${i}.label`,x.label),`removeItem('stats',${i})`)).join('');
$('servicesItems').innerHTML=cfg.services.map((x,i)=>itemCard('Service '+(i+1),inp('Name',`services.${i}.name`,x.name)+inp('Icon',`services.${i}.icon`,x.icon)+inp('Description',`services.${i}.desc`,x.desc,true),`removeItem('services',${i})`)).join('');
$('portfolioItems').innerHTML=cfg.portfolio.map((x,i)=>itemCard('Project '+(i+1),inp('Title',`portfolio.${i}.title`,x.title)+inp('Category',`portfolio.${i}.category`,x.category)+inp('Image URL',`portfolio.${i}.image`,x.image)+inp('Description',`portfolio.${i}.description`,x.description,true),`removeItem('portfolio',${i})`)).join('');
$('processItems').innerHTML=cfg.process.map((x,i)=>itemCard('Step '+(i+1),inp('Title',`process.${i}.title`,x.title)+inp('Description',`process.${i}.desc`,x.desc,true),`removeItem('process',${i})`)).join('');
$('testimonialItems').innerHTML=cfg.testimonials.map((x,i)=>itemCard('Testimonial '+(i+1),inp('Name',`testimonials.${i}.name`,x.name)+inp('Role',`testimonials.${i}.role`,x.role)+inp('Review',`testimonials.${i}.review`,x.review,true)+inp('Rating 1–5',`testimonials.${i}.rating`,x.rating),`removeItem('testimonials',${i})`)).join('');
$('pricingItems').innerHTML=cfg.pricing.map((x,i)=>itemCard('Plan '+(i+1),inp('Plan name',`pricing.${i}.name`,x.name)+`<div class="row">${inp('Price',`pricing.${i}.price`,x.price)}${inp('Period',`pricing.${i}.period`,x.period)}</div>`+inp('Features — one per line',`pricing.${i}.features`,x.features.join('\n'),true)+`<label><input type="checkbox" data-path="pricing.${i}.popular" ${x.popular?'checked':''}> Mark as Most Popular</label>`,`removeItem('pricing',${i})`)).join('');
$('productItems').innerHTML=cfg.products.map((x,i)=>itemCard('Product '+(i+1),inp('Name',`products.${i}.name`,x.name)+`<div class="row">${inp('Price',`products.${i}.price`,x.price)}${inp('Badge',`products.${i}.badge`,x.badge)}</div>`+inp('Description',`products.${i}.desc`,x.desc,true),`removeItem('products',${i})`)).join('');}
function getObj(path){return path.split('.').reduce((o,k)=>o[k],cfg)}
function setObj(path,val){let p=path.split('.'),o=cfg;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p.at(-1)]=val}
function collect(){document.querySelectorAll('[data-path]').forEach(el=>{let v=el.type==='checkbox'?el.checked:el.value;let path=el.dataset.path;if(path==='tools')v=v.split(',').map(s=>s.trim()).filter(Boolean);else if(/^testimonials\.\d+\.rating$/.test(path))v=Math.max(1,Math.min(5,Number(v)||5));else if(/^pricing\.\d+\.features$/.test(path))v=v.split('\n').map(s=>s.trim()).filter(Boolean);setObj(path,v)})}
function bindPaths(){document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',()=>{}));}
function bindTabs(){$$('.tab').forEach(b=>b.onclick=()=>{collect();$$('.tab').forEach(x=>x.classList.remove('active'));$$('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('sec-'+b.dataset.tab).classList.add('active')})}
const $$=s=>[...document.querySelectorAll(s)];
function addStat(){collect();cfg.stats.push({number:'10+',label:'New stat'});render()};function addService(){collect();cfg.services.push({name:'New Service',icon:'✦',desc:'Describe this service.'});render()};function addPortfolio(){collect();cfg.portfolio.push({title:'New Project',category:'Branding',image:'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=1000&q=80',description:'Project description.'});render()};function addProcess(){collect();cfg.process.push({title:'New Step',desc:'Describe this step.'});render()};function addTestimonial(){collect();cfg.testimonials.push({name:'New Client',role:'Client',review:'Great experience.',rating:5});render()};function addPricing(){collect();cfg.pricing.push({name:'New Plan',price:'₹999',period:'/ package',features:['Feature 1','Feature 2'],popular:false});render()};function addProduct(){collect();cfg.products.push({name:'New Creative Pack',price:'₹299',badge:'NEW',desc:'Add product description.'});render()};function removeItem(key,i){collect();if(confirm('Delete this item?')){cfg[key].splice(i,1);render()}}
$('saveBtn').onclick=async()=>{collect();$('saveMsg').textContent='Saving...';try{await db.collection('site').doc('config').set({...cfg,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});$('saveMsg').textContent='✓ Saved to cloud';}catch(e){$('saveMsg').textContent='Save failed: '+e.message}};
$('logout').onclick=()=>auth.signOut();$('loginBtn').onclick=async()=>{try{await auth.signInWithEmailAndPassword($('emailLogin').value.trim(),$('passLogin').value);$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent=e.message}};
function start(){firebase.initializeApp(window.ANANDESHWAR_FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(async u=>{if(u&&u.uid===ADMIN_UID){$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.email||u.uid;try{let d=await db.collection('site').doc('config').get();cfg=d.exists?{...DEFAULTS,...d.data()}:structuredClone(DEFAULTS)}catch(e){}render()}else{$('loginBox').classList.remove('hidden');$('app').classList.add('hidden');if(u)await auth.signOut()}})}
start();
</script></body></html>
