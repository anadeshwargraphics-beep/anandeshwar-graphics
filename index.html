 $('#productsTitle').innerHTML=safeHtml(cfg.productsTitle);$('#productsIntro').textContent=cfg.productsIntro;$('#productGrid').innerHTML=(cfg.products||[]).map((p,i)=>`<div class="card reveal"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div class="icon">${['✦','◈','▣','▤','✳','◆'][i%6]}</div>${p.badge?`<span style="background:linear-gradient(110deg,#ff9a00,#ed2f82);color:white;padding:6px 9px;border-radius:999px;font-size:.65rem;font-weight:800">${esc(p.badge)}</span>`:''}</div><h3 style="margin-top:18px">${esc(p.name)}</h3><p>${esc(p.desc)}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px"><strong style="font-size:1.2rem">${esc(p.price)}</strong><a class="btn btn-primary" target="_blank" href="${waLink(cfg.whatsapp,'Hello Anandeshwar Graphics! I want to buy '+p.name+' for '+p.price+'.')}">Buy on WhatsApp ↗</a></div></div>`).join('');
 $('#contactTitle').innerHTML=safeHtml(cfg.contactTitle);$('#contactIntro').textContent=cfg.contactIntro;$('#contactWa').textContent='+'+String(cfg.whatsapp||'').replace(/^(91)(\d)/,'$1 $2');$('#contactEmail').textContent=cfg.email;$('#contactLocation').textContent=cfg.location;$('#waFloat').href=waLink(cfg.whatsapp);$('#footerText').textContent=cfg.footerText;$('#footerLinks').innerHTML=`<a href="#home">${esc(cfg.nav.home)}</a><a href="#portfolio">${esc(cfg.nav.work)}</a><a href="#contact">${esc(cfg.nav.contact)}</a><a href="${esc(cfg.instagram)}" target="_blank">Instagram</a>`;$('#contactService').innerHTML=(cfg.services||[]).map(x=>`<option>${esc(x.name)}</option>`).join('')+'<option>Other</option>';bindContact();animate();}
function setA(sel,text,href){let a=$(sel);a.textContent=text;a.href=href}
function bindContact(){let form=$('#contactForm');form.onsubmit=e=>{e.preventDefault();let d=new FormData(form);let t=`Hello Anandeshwar Graphics!\n\nName: ${d.get('name')}\nPhone: ${d.get('phone')}\nService: ${d.get('service')}\nMessage: ${d.get('message')}`;open(waLink(cfg.whatsapp,t),'_blank')}}
function bindPortfolio(){$$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');let f=b.dataset.filter;$$('.work').forEach(w=>w.style.display=f==='all'||w.dataset.cat===f?'block':'none')});let lb=$('#lightbox'),li=$('#lightboxImg');$$('.work').forEach(w=>w.onclick=()=>{let im=$('img',w);li.src=im.src;li.alt=im.alt;lb.classList.add('open')});$('#closeLightbox').onclick=()=>lb.classList.remove('open');lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')}}
function animate(){if(!window.gsap||reduce)return;gsap.registerPlugin(ScrollTrigger);$$('.reveal').forEach(e=>gsap.from(e,{y:30,opacity:0,duration:.65,scrollTrigger:{trigger:e,start:'top 88%',once:true}}));}
addEventListener('scroll',()=>{$('#progress').style.width=(scrollY/(document.documentElement.scrollHeight-innerHeight)*100||0)+'%';$('#navbar').classList.toggle('scrolled',scrollY>30)});$('#year').textContent=new Date().getFullYear();
window.addEventListener('load',()=>{let i=$('#intro');if(reduce)i.remove();else{gsap.from('.intro-logo',{y:30,opacity:0,duration:.7});gsap.to(i,{opacity:0,duration:.7,delay:.8,onComplete:()=>i.remove()})}});
try{const fb=window.ANANDESHWAR_FIREBASE_CONFIG;if(fb&&window.firebase){firebase.initializeApp(fb);firebase.firestore().collection('site').doc('config').onSnapshot(d=>render(d.exists?d.data():defaults),()=>render(defaults))}else render(defaults)}catch(e){render(defaults)}
</script></body></html>
